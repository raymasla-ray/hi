<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>答案卡</title>
  <style>
    body {
      background-color: #0f172a; /* 專業深藍背景 */
      color: #f1f5f9;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
    }
    .container {
      background-color: #1e293b;
      padding: 30px;
      border-radius: 12px;
      border: 1px solid #334155; /* 實線邊框，無發光特效 */
      width: 90%;
      max-width: 400px;
      text-align: center;
    }
    input[type="text"] {
      width: 100%;
      padding: 15px;
      margin-bottom: 20px;
      border-radius: 8px;
      border: 1px solid #475569;
      background-color: #0f172a;
      color: #f1f5f9;
      font-size: 18px;
      box-sizing: border-box;
    }
    button {
      width: 100%;
      padding: 15px;
      background-color: #2563eb; /* 深藍色按鈕 */
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 18px;
      cursor: pointer;
      transition: background-color 0.2s;
    }
    button:hover:not(:disabled) {
      background-color: #1d4ed8;
    }
    button:disabled {
      background-color: #475569;
      cursor: not-allowed;
      color: #94a3b8;
    }
    #status {
      margin-top: 15px;
      font-size: 16px;
      color: #93c5fd;
      height: 20px;
    }
  </style>
</head>
<body>

  <div class="container">
    <h2>匿名傳送答案</h2>
    <input type="text" id="messageInput" placeholder="請輸入內容..." autocomplete="off" maxlength="75">
    <button id="sendBtn">送 出</button>
    <div id="status"></div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
    import { getDatabase, ref, push } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCoiGdzVj444DrYQibsnPZ9aApkQ7abmbA",
      authDomain: "datab-811c1.firebaseapp.com",
      databaseURL: "https://datab-811c1-default-rtdb.asia-southeast1.firebasedatabase.app", // 補上資料庫網址
      projectId: "datab-811c1",
      storageBucket: "datab-811c1.firebasestorage.app",
      messagingSenderId: "181479643722",
      appId: "1:181479643722:web:da549d48bc15bc26aee4b3",
      measurementId: "G-27VLHPB5N0"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    const input = document.getElementById('messageInput');
    const btn = document.getElementById('sendBtn');
    const status = document.getElementById('status');
    const COOLDOWN_TIME = 30000; // 30秒

    // 檢查是否有正在進行的冷卻
    function checkCooldown() {
      const lastSent = localStorage.getItem('lastSentTime');
      if (lastSent) {
        const timePassed = Date.now() - parseInt(lastSent);
        if (timePassed < COOLDOWN_TIME) {
          const remainingSeconds = Math.ceil((COOLDOWN_TIME - timePassed) / 1000);
          startCooldownUI(remainingSeconds);
        }
      }
    }

    // 啟動 UI 倒數計時
    function startCooldownUI(seconds) {
      input.disabled = true;
      btn.disabled = true;
      let timeLeft = seconds;
      status.textContent = `冷卻中... 請稍後 ${timeLeft} 秒`;

      const timer = setInterval(() => {
        timeLeft--;
        if (timeLeft <= 0) {
          clearInterval(timer);
          input.disabled = false;
          btn.disabled = false;
          status.textContent = "";
          input.value = "";
          input.focus();
        } else {
          status.textContent = `冷卻中... 請稍後 ${timeLeft} 秒`;
        }
      }, 1000);
    }

    // 發送按鈕事件
    btn.addEventListener('click', () => {
      const text = input.value.trim();
      if (!text) return;

      input.disabled = true;
      btn.disabled = true;
      status.textContent = "發送中...";

      push(ref(db, 'messages'), {
        content: text,
        timestamp: Date.now()
      }).then(() => {
        localStorage.setItem('lastSentTime', Date.now());
        startCooldownUI(30);
      }).catch((error) => {
        status.textContent = "發送失敗，請重試。";
        input.disabled = false;
        btn.disabled = false;
        console.error(error);
      });
    });

    // 載入時檢查冷卻
    checkCooldown();
  </script>
</body>
</html>
